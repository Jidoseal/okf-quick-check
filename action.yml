name: "JidoSeal OKF quick check"
description: "Pick a folder, scan it: grade markdown against OKF Folder Criteria v1.0.0 (OKF Certified, Bronze, Silver, Gold)."
author: "JidoSeal"
branding:
  icon: "check-circle"
  color: "yellow"
inputs:
  path:
    description: "Folder to scan, relative to the repository root."
    required: false
    default: "."
  min-tier:
    description: "Fail the step if the folder reaches a lower grade. One of none, okf-certified, bronze, silver, gold (OKF Folder Criteria v1.0.0)."
    required: false
    default: "none"
  jidoseal-version:
    description: "Version of the jidoseal command-line tool from PyPI. 0.2.0 or later."
    required: false
    default: "0.2.0"
outputs:
  tier:
    description: "Grade the whole folder reaches: gold, silver, bronze, okf-certified or none."
    value: ${{ steps.scan.outputs.tier }}
  criteria-version:
    description: "Version of the OKF Folder Criteria the grade uses."
    value: ${{ steps.scan.outputs.criteria-version }}
  score:
    description: "Mean of the four coverage figures, 0 to 100."
    value: ${{ steps.scan.outputs.score }}
  okf-certified-coverage:
    description: "Percent of files meeting OKF Certified."
    value: ${{ steps.scan.outputs.okf-certified-coverage }}
  bronze-coverage:
    description: "Percent of files meeting Bronze."
    value: ${{ steps.scan.outputs.bronze-coverage }}
  silver-coverage:
    description: "Percent of files meeting Silver."
    value: ${{ steps.scan.outputs.silver-coverage }}
  gold-coverage:
    description: "Percent of files meeting Gold."
    value: ${{ steps.scan.outputs.gold-coverage }}
runs:
  using: "composite"
  steps:
    - name: Scan the folder
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_MIN_TIER: ${{ inputs.min-tier }}
        INPUT_VERSION: ${{ inputs.jidoseal-version }}
      run: bash "${{ github.action_path }}/scan.sh"
